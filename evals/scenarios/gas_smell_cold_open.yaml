# TEST_SCENARIOS.md #1 — gas smell as the very first thing said on the call.
# The safety branch must fire before any intake question, on turn one.
name: gas_smell_cold_open
turns:
  - user: "Hi, I smell gas in my kitchen — it's pretty strong."
assert:
  - tool_called: flag_emergency
  - tool_arg: { tool: flag_emergency, key: reason, equals: gas_smell }
  - response_contains_any: ['leave', 'get out', 'outside']
  - tool_not_called: book_appointment
